<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="./dist/css/main.css">

    <title>Perfil - Echo Moda</title>
</head>
<body>
    <header>
        <div class="cabecalho">
            <i class="fas fa-chevron-left" id="seta-voltar-home"></i>
            <h1 class="mb-0 cabecalho__nome-loja">Meus dados</h1>
        </div>
    </header>
    <main class="main-perfil">
        <div class="container-mae d-flex">
        <div class="menu-lateral-dados">
            <div class="menu-lateral-dados_cabecalho-menu">
                <img src="./src/imagens/background-bloco-de-ofertas.png" class="menu-lateral-dados_cabecalho-menu_foto-perfil">
                <h2 class="menu-lateral-dados_cabecalho-menu_user-nome" id="campo-nome">#</h2>
                <p class="menu-lateral-dados_cabecalho-menu_user-email mb-0" id="espaco-email">#</p>
            </div>
            <div class="corpo-menu-lateral">
                <div class="corpo-menu-lateral_botoes">
                    <button class="btn btn-primary active" data-id="perfil" id="botao-inicial-perfil">
                        Perfil <i class="fa-solid fa-user"></i>
                    </button>
                    <button class="btn btn-primary" data-id="endereço">
                        Endereço
                    </button>
                    <button class="btn btn-primary" data-id="historico">
                        Historico
                    </button>
                    <button class="btn btn-primary" data-id="email">
                        Email
                    </button>
                </div>
            </div>
        </div>
        <div class="container-conteudo-escolhido">
            <h2 class="titulo-conteudo">Meus dados</h2>
            <div class="meus-dados-card" id="meus-dados-card">
                <form class="meus-dados-form">
                    <div class="meus-dados-grid">
                        <div class="campo">
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome-usuario-meus-dados" maxlength="32" >
                        </div>
                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input id="input-email-meus-dados" type="email">
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone (DDD)</label>
                            <input type="tel" id="input-telefone-meus-dados">
                        </div>
                        <div class="campo">
                            <label for="nascimento">Data de nascimento</label>
                            <input id="nascimento" type="date">
                        </div>
                    </div>
                    <div class="acoes-dados">
                        <button type="button" class="btn-cancelar" id="btn-cancelar-alteracao-meus-dados">Cancelar</button>
                        <button type="submit" class="btn-salvar" id="btn-salvar-alteracao-meus-dados">Salvar alterações</button>
                    </div>
                </form>
            </div>
            <div class="meus-dados-card" id="meus-dados-card">
                <form class="meus-dados-form">
                    <div class="meus-dados-grid">
                        <div class="campo">
                            <label for="nome">Cep</label>
                            <input type="text" value="." id="nome-usuario-form">
                        </div>
                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input id="email" type="email" value="daniel.@gmail.com">
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input id="telefone" type="tel" value="+55 11 9XXXX-XXXX">
                        </div>
                        <div class="campo">
                            <label for="nascimento">Data de nascimento</label>
                            <input id="nascimento" type="date">
                        </div>
                    </div>
                    <div class="acoes-dados">
                        <button type="button" class="btn-cancelar">Cancelar</button>
                        <button type="submit" class="btn-salvar">Salvar alterações</button>
                    </div>
                </form>
            </div>
        </div>
        </div>
        <div class="confirmacao-adicao-carrinho">
            <div class="container">
                <h5><i class="fas fa-check-circle me-2" style="color: #28a745;"></i>Produto adicionado ao carrinho!</h5>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js" integrity="sha512-pHVGpX7F/27yZ0ISY+VVjyULApbDlD0/X0rgGbTqCE7WFW5MezNTWG/dnhtbBuICzsd0WQPgpE4REBLv+UqChw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="./dist/js/main.js"></script>
</body>
</html>
